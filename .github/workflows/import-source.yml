name: Import NovaBank source
on:
  push:
    paths:
      - "novabank-source.tar.gz"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract source files
        run: |
          tar -xzf novabank-source.tar.gz -C .
          rm novabank-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import NovaBank project source"
          git push
