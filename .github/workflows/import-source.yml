name: Import NovaBank source
on:
  push:
    paths:
      - ".source-parts/**"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble and extract source
        run: |
          cat .source-parts/* | base64 -d > novabank-source.tar.xz
          xz -dc novabank-source.tar.xz | tar -xf - -C .
          rm -rf .source-parts novabank-source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import cleaned NovaBank project source"
          git push
